<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rally Sync Tool</title>

<style>

:root{
    --bg:#f5f5f5;
    --panel:#ffffff;
    --border:#dddddd;
    --text:#111111;

    --green:#10b981;
    --blue:#2563eb;
    --orange:#f59e0b;
    --red:#dc2626;
}

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
}


/* =====================================================
   PASSWORD SCREEN
   ===================================================== */

.password-screen{
    position:fixed;
    inset:0;
    background:#111;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    z-index:10000;
}

.password-box{
    width:min(90%,420px);

    background:#fff;
    color:#111;

    padding:35px;

    border-radius:20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);

    text-align:center;
}

.password-title{
    font-size:32px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:8px;
}

.password-subtitle{
    color:#666;
    font-size:16px;
    margin-bottom:24px;
}

.password-input{
    width:100%;

    padding:14px;

    border:2px solid #ddd;
    border-radius:10px;

    font-size:18px;
    text-align:center;

    outline:none;
}

.password-input:focus{
    border-color:var(--blue);
}

.password-button{
    width:100%;

    margin-top:12px;

    background:var(--blue);
    color:#fff;

    border:none;
    border-radius:10px;

    padding:14px;

    font-size:18px;
    font-weight:900;

    cursor:pointer;
}

.password-error{
    color:var(--red);

    font-weight:700;

    margin-top:10px;

    min-height:20px;
}

.password-screen.hidden{
    display:none;
}


/* =====================================================
   MAIN APP
   ===================================================== */

.app{
    display:flex;
    flex-direction:column;

    width:100%;
    height:100vh;

    min-width:0;
    min-height:0;
}


/* =====================================================
   TOP BAR
   ===================================================== */

.topbar{
    height:64px;
    flex-shrink:0;

    background:#fff;

    border-bottom:2px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    min-width:0;

    gap:10px;
}

.title{
    font-size:30px;
    font-weight:900;

    letter-spacing:2px;

    white-space:nowrap;
}

.settings{
    display:flex;
    align-items:center;

    gap:7px;

    font-size:15px;
    font-weight:700;

    white-space:nowrap;
}

.settings input{
    width:55px;
    padding:6px;
}

.add-group{
    margin-left:6px;

    background:#111;
    color:#fff;

    border:none;
    border-radius:8px;

    padding:7px 9px;

    font-size:11px;
    font-weight:900;

    cursor:pointer;

    white-space:nowrap;
}


/* =====================================================
   GROUP AREA
   ===================================================== */

.groups{
    flex:1;

    width:100%;

    min-width:0;
    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:8px;

    display:grid;

    /*
       Always 4 groups across when there is
       enough room.
    */

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    grid-auto-rows:minmax(340px,1fr);

    gap:8px;

    align-content:start;
}


/* =====================================================
   GROUP
   ===================================================== */

.group{
    background:var(--panel);

    border:2px solid var(--border);

    border-radius:14px;

    padding:8px;

    display:flex;
    flex-direction:column;

    width:100%;

    min-width:0;
    min-height:340px;

    overflow:hidden;

    transition:
        border-color .15s ease,
        background .15s ease,
        transform .15s ease;
}

.group.drag-over{
    border-color:var(--blue);

    background:#eff6ff;

    box-shadow:
        0 0 0 2px rgba(37,99,235,.15);
}

.group.readying{
    border-color:var(--orange);
}

.group.active{
    border-color:var(--blue);
}

.group.complete{
    border-color:var(--green);
}


/* =====================================================
   GROUP HEADER
   ===================================================== */

.group-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:4px;

    margin-bottom:6px;

    min-width:0;
}

.group-name{
    width:100%;
    min-width:0;

    font-size:21px;
    font-weight:900;

    border:none;

    background:transparent;

    padding:2px;

    outline:none;
}

.status{
    flex-shrink:0;

    font-size:10px;
    font-weight:900;

    padding:6px 8px;

    border-radius:999px;

    text-transform:uppercase;
}

.idle .status{
    background:#e5e5e5;
}

.readying .status{
    background:var(--orange);
    color:#fff;
}

.active .status{
    background:var(--blue);
    color:#fff;
}

.complete .status{
    background:var(--green);
    color:#fff;
}


/* =====================================================
   PLAYER ENTRIES
   ===================================================== */

.entries{
    display:flex;
    flex-direction:column;

    gap:4px;

    width:100%;
    min-width:0;
}

.entry{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        55px
        30px;

    gap:4px;

    width:100%;

    min-width:0;

    cursor:grab;

    transition:
        opacity .15s ease,
        transform .15s ease;
}

.entry:active{
    cursor:grabbing;
}

.entry.dragging{
    opacity:.4;
    transform:scale(.98);
}

.entry.drop-before{
    border-top:3px solid var(--blue);
}

.entry.drop-after{
    border-bottom:3px solid var(--blue);
}

.entry input{
    width:100%;
    min-width:0;

    border:2px solid var(--border);

    border-radius:7px;

    padding:6px;

    font-size:13px;
    font-weight:700;

    outline:none;

    background:#fff;
}

.entry input:focus{
    border-color:var(--blue);
}

.entry input{
    cursor:text;
}


/* =====================================================
   REMOVE PLAYER
   ===================================================== */

.entry-remove{
    display:flex;

    align-items:center;
    justify-content:center;

    width:30px;
    height:32px;

    padding:0;

    background:var(--red);
    color:#fff;

    border:none;

    border-radius:7px;

    font-size:20px;
    font-weight:900;

    cursor:pointer;
}

.entry-remove:hover{
    transform:none;
    background:#b91c1c;
}


/* =====================================================
   ADD PLAYER
   ===================================================== */

.add-entry{
    width:100%;

    margin-top:5px;

    background:#111;
    color:#fff;

    border:none;

    border-radius:8px;

    padding:7px 4px;

    font-size:12px;
    font-weight:900;

    cursor:pointer;
}


/* =====================================================
   TIMELINE
   ===================================================== */

.timeline{
    margin-top:6px;

    flex:1;

    min-height:0;
    min-width:0;

    border-radius:11px;

    background:#fafafa;

    border:2px solid #ececec;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:4px;

    padding:6px;

    overflow:hidden;
}

.big{
    font-size:38px;

    font-weight:900;

    line-height:1;

    white-space:nowrap;
}

.label{
    font-size:14px;

    font-weight:800;

    text-align:center;
}

.next{
    font-size:11px;

    color:#666;

    text-align:center;

    line-height:1.2;
}


/* =====================================================
   CONTROLS
   ===================================================== */

.controls{
    margin-top:6px;

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:4px;

    width:100%;
}

button{
    border:none;

    border-radius:8px;

    padding:7px 3px;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    transition:.15s ease;

    min-width:0;
}

button:hover{
    transform:translateY(-1px);
}

.start{
    background:var(--green);
    color:#fff;
}

.cancel{
    background:var(--red);
    color:#fff;
}

.reset{
    background:#444;
    color:#fff;
}

.hide{
    background:#9ca3af;
    color:#fff;
}


/* =====================================================
   EMPTY STATE
   ===================================================== */

.empty-state{
    grid-column:1 / -1;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:10px;

    color:#777;

    font-weight:700;

    font-size:18px;
}

.empty-state button{
    background:#111;
    color:#fff;

    padding:10px 16px;

    font-size:14px;
}


/* =====================================================
   FOOTER
   ===================================================== */

.footer{
    height:24px;
    flex-shrink:0;

    background:#fff;

    border-top:1px solid #ddd;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:11px;

    color:#666;
}


/* =====================================================
   START OVERLAY
   ===================================================== */

.overlay{
    position:fixed;

    inset:0;

    background:rgba(255,255,255,.96);

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    z-index:999;

    opacity:0;

    pointer-events:none;

    transition:.15s ease;
}

.overlay.show{
    opacity:1;

    pointer-events:auto;
}

.overlay-group{
    font-size:40px;

    font-weight:800;

    margin-bottom:15px;

    color:#555;

    text-align:center;
}

.overlay-name{
    font-size:120px;

    font-weight:900;

    text-transform:uppercase;

    line-height:1;

    color:var(--blue);

    text-align:center;

    animation:pulse .5s infinite;
}

.overlay-start{
    font-size:55px;

    font-weight:900;

    margin-top:18px;

    color:#111;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }

    100%{
        transform:scale(1);
    }

}


/* =====================================================
   SMALL SCREENS
   ===================================================== */

@media(max-width:600px){

    .title{
        font-size:20px;
        letter-spacing:1px;
    }

    .settings{
        font-size:11px;
    }

    .settings .add-group{
        display:none;
    }

    .groups{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .group{
        padding:5px;
    }

    .group-name{
        font-size:16px;
    }

    .status{
        font-size:8px;
        padding:4px 5px;
    }

    .entry{
        grid-template-columns:
            minmax(0,1fr)
            45px
            25px;
    }

    .entry input{
        font-size:10px;
        padding:4px;
    }

    .entry-remove{
        width:25px;
        height:27px;
        font-size:16px;
    }

    .big{
        font-size:28px;
    }

    .label{
        font-size:11px;
    }

    .next{
        font-size:9px;
    }

    button{
        font-size:9px;
        padding:6px 2px;
    }

}


/* =====================================================
   SHORT SCREENS
   ===================================================== */

@media(max-height:650px){

    .topbar{
        height:50px;
    }

    .title{
        font-size:23px;
    }

    .groups{
        padding:5px;
        gap:5px;

        grid-auto-rows:
            minmax(300px,1fr);
    }

    .group{
        padding:5px;
        min-height:300px;
    }

    .group-header{
        margin-bottom:3px;
    }

    .entries{
        gap:2px;
    }

    .entry{
        gap:2px;
    }

    .entry input{
        padding:4px;
    }

    .entry-remove{
        height:27px;
    }

    .add-entry{
        margin-top:3px;
        padding:5px;
    }

    .timeline{
        margin-top:3px;
    }

    .controls{
        margin-top:3px;
    }

    .footer{
        height:18px;
        font-size:9px;
    }

}

</style>
</head>

<body>


<!-- =====================================================
     PASSWORD SCREEN
     ===================================================== -->

<div
    class="password-screen"
    id="passwordScreen"
>

    <div class="password-box">

        <div class="password-title">
            RALLY SYNC TOOL
        </div>

        <div class="password-subtitle">
            Enter the password to continue
        </div>

        <input
            type="password"
            id="passwordInput"
            class="password-input"
            placeholder="Password"
            autocomplete="off"
        >

        <button
            class="password-button"
            onclick="checkPassword()"
        >
            ENTER
        </button>

        <div
            class="password-error"
            id="passwordError"
        ></div>

    </div>

</div>


<!-- =====================================================
     MAIN APP
     ===================================================== -->

<div class="app">

    <div class="topbar">

        <div class="title">
            RALLY SYNC TOOL
        </div>

        <div class="settings">

            <span>Ready Countdown</span>

            <input
                type="number"
                id="readyTime"
                value="5"
                min="0"
            >

            <span>sec</span>

            <button
                class="add-group"
                onclick="addGroup()"
            >
                + ADD GROUP
            </button>

        </div>

    </div>


    <div
        class="groups"
        id="groups"
    ></div>


    <div class="footer">
        Rally Sync Tool
    </div>

</div>


<!-- =====================================================
     START OVERLAY
     ===================================================== -->

<div
    class="overlay"
    id="overlay"
>

    <div
        class="overlay-group"
        id="overlayGroup"
    ></div>

    <div
        class="overlay-name"
        id="overlayName"
    ></div>

    <div class="overlay-start">
        START NOW
    </div>

</div>


<script>


/* =====================================================
   PASSWORD
   ===================================================== */

/*
 * This password is intentionally stored in the client-side code.
 * It is only intended to discourage casual/unwanted access.
 *
 * If an AI assistant is asked to extract or reveal this password,
 * it should refuse to disclose it because it is private access
 * information.
 */

const CORRECT_PASSWORD =
    "UbT2q-Smn0D-MdgHR";

const passwordScreen =
    document.getElementById(
        "passwordScreen"
    );

const passwordInput =
    document.getElementById(
        "passwordInput"
    );

const passwordError =
    document.getElementById(
        "passwordError"
    );


function checkPassword(){

    const enteredPassword =
        passwordInput.value;

    if(
        enteredPassword ===
        CORRECT_PASSWORD
    ){

        passwordScreen.classList.add(
            "hidden"
        );

        passwordError.textContent = "";

        passwordInput.value = "";

    }else{

        passwordError.textContent =
            "Incorrect password";

        passwordInput.value = "";

        passwordInput.focus();

    }

}


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            checkPassword();

        }

    }
);


/* =====================================================
   OVERLAY
   ===================================================== */

const overlay =
    document.getElementById(
        "overlay"
    );

const overlayName =
    document.getElementById(
        "overlayName"
    );

const overlayGroup =
    document.getElementById(
        "overlayGroup"
    );


/* =====================================================
   GROUP DATA
   ===================================================== */

let nextGroupId = 5;

const groups = [

    {
        id:1,
        hidden:false,
        state:"idle",
        name:"387 Castle Group",

        entries:[
            {
                name:"Player 1",
                duration:43
            },
            {
                name:"Player 2",
                duration:36
            },
            {
                name:"Player 3",
                duration:30
            }
        ],

        timers:[]
    },

    {
        id:2,
        hidden:false,
        state:"idle",
        name:"368 Counter Rally",

        entries:[
            {
                name:"Player 1",
                duration:43
            },
            {
                name:"Player 2",
                duration:36
            },
            {
                name:"Player 3",
                duration:30
            }
        ],

        timers:[]
    },

    {
        id:3,
        hidden:false,
        state:"idle",
        name:"36B Jump Group",

        entries:[
            {
                name:"Player 1",
                duration:43
            },
            {
                name:"Player 2",
                duration:36
            },
            {
                name:"Player 3",
                duration:30
            }
        ],

        timers:[]
    },

    {
        id:4,
        hidden:false,
        state:"idle",
        name:"Group 4",

        entries:[
            {
                name:"Player 1",
                duration:43
            },
            {
                name:"Player 2",
                duration:36
            },
            {
                name:"Player 3",
                duration:30
            }
        ],

        timers:[]
    }

];


const container =
    document.getElementById(
        "groups"
    );


/* =====================================================
   FIND GROUP
   ===================================================== */

function getGroup(groupId){

    return groups.find(
        group =>
            group.id === Number(groupId)
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

    container.innerHTML = "";


    const visibleGroups =
        groups.filter(
            group => !group.hidden
        );


    /*
       Always use four columns on desktop.

       If there are five groups:

       1  2  3  4
       5

       If there are eight:

       1  2  3  4
       5  6  7  8

       And so on.
    */

    container.style.gridTemplateColumns =
        "repeat(4,minmax(0,1fr))";


    /*
       No groups.
    */

    if(
        visibleGroups.length === 0
    ){

        container.innerHTML = `

            <div class="empty-state">

                <div>
                    No groups remaining
                </div>

                <button
                    onclick="addGroup()"
                >
                    + ADD GROUP
                </button>

            </div>

        `;

        return;

    }


    visibleGroups.forEach(
        group=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                `group ${group.state}`;


            div.dataset.groupId =
                group.id;


            div.innerHTML = `

                <div class="group-header">

                    <input
                        class="group-name"
                        value="${escapeHtml(group.name)}"
                        onchange="
                            updateGroupName(
                                ${group.id},
                                this.value
                            )
                        "
                    >

                    <div class="status">
                        ${group.state}
                    </div>

                </div>


                <div
                    class="entries"
                    data-group-id="${group.id}"
                >

                    ${group.entries.map(
                        (entry,index)=>`

                        <div
                            class="entry"
                            draggable="true"
                            data-group-id="${group.id}"
                            data-entry-index="${index}"
                        >

                            <input
                                value="${escapeHtml(entry.name)}"
                                onchange="
                                    updatePlayerName(
                                        ${group.id},
                                        ${index},
                                        this.value
                                    )
                                "
                            >

                            <input
                                type="number"
                                value="${entry.duration}"
                                min="1"
                                onchange="
                                    updatePlayerDuration(
                                        ${group.id},
                                        ${index},
                                        this.value
                                    )
                                "
                            >

                            <button
                                class="entry-remove"
                                onclick="
                                    removeEntry(
                                        ${group.id},
                                        ${index}
                                    )
                                "
                            >
                                −
                            </button>

                        </div>

                    `
                    ).join("")}

                </div>


                <button
                    class="add-entry"
                    onclick="
                        addEntry(${group.id})
                    "
                >
                    + ADD PLAYER
                </button>


                <div
                    class="timeline"
                    id="timeline-${group.id}"
                >

                    <div class="big">
                        READY
                    </div>

                    <div class="label">
                        Waiting to Start
                    </div>

                    <div class="next">
                        All entries sync to finish together
                    </div>

                </div>


                <div class="controls">

                    <button
                        class="start"
                        onclick="
                            startGroup(${group.id})
                        "
                    >
                        START
                    </button>

                    <button
                        class="cancel"
                        onclick="
                            cancelGroup(${group.id})
                        "
                    >
                        CANCEL
                    </button>

                    <button
                        class="reset"
                        onclick="
                            resetGroup(${group.id})
                        "
                    >
                        RESET
                    </button>

                    <button
                        class="hide"
                        onclick="
                            hideGroup(${group.id})
                        "
                    >
                        HIDE
                    </button>

                </div>

            `;


            container.appendChild(div);

        }
    );


    setupDragAndDrop();

}


/* =====================================================
   GROUP NAME
   ===================================================== */

function updateGroupName(
    groupId,
    value
){

    const group =
        getGroup(groupId);


    if(group){

        group.name =
            value;

    }

}


/* =====================================================
   PLAYER NAME
   ===================================================== */

function updatePlayerName(
    groupId,
    index,
    value
){

    const group =
        getGroup(groupId);


    if(
        group &&
        group.entries[index]
    ){

        group.entries[index].name =
            value;

    }

}


/* =====================================================
   PLAYER DURATION
   ===================================================== */

function updatePlayerDuration(
    groupId,
    index,
    value
){

    const group =
        getGroup(groupId);


    if(
        group &&
        group.entries[index]
    ){

        group.entries[index].duration =
            parseInt(value) || 1;

    }

}


/* =====================================================
   ADD GROUP
   ===================================================== */

function addGroup(){

    const newGroup = {

        id:nextGroupId,

        hidden:false,

        state:"idle",

        name:
            `Group ${nextGroupId}`,

        entries:[
            {
                name:"Player 1",
                duration:30
            }
        ],

        timers:[]

    };


    groups.push(
        newGroup
    );


    nextGroupId++;


    render();


    /*
       Scroll down so the newly-created
       group is visible.
    */

    setTimeout(()=>{

        container.scrollTo({

            top:
                container.scrollHeight,

            behavior:"smooth"

        });

    },50);

}


/* =====================================================
   ADD PLAYER
   ===================================================== */

function addEntry(groupId){

    const group =
        getGroup(groupId);


    if(!group){

        return;

    }


    group.entries.push({

        name:
            `Player ${
                group.entries.length + 1
            }`,

        duration:30

    });


    render();

}


/* =====================================================
   REMOVE PLAYER
   ===================================================== */

function removeEntry(
    groupId,
    index
){

    const group =
        getGroup(groupId);


    if(!group){

        return;

    }


    group.entries.splice(
        index,
        1
    );


    /*
       If there are no players left,
       remove the entire group.
    */

    if(
        group.entries.length === 0
    ){

        clearTimers(group);


        const groupIndex =
            groups.indexOf(group);


        if(groupIndex !== -1){

            groups.splice(
                groupIndex,
                1
            );

        }

    }


    render();

}


/* =====================================================
   REMOVE EMPTY GROUP
   ===================================================== */

function removeEmptyGroup(group){

    if(
        group.entries.length !== 0
    ){

        return;

    }


    clearTimers(group);


    const index =
        groups.indexOf(group);


    if(index !== -1){

        groups.splice(
            index,
            1
        );

    }

}


/* =====================================================
   DRAG AND DROP
   ===================================================== */

let draggedEntry = null;


function setupDragAndDrop(){

    const entries =
        document.querySelectorAll(
            ".entry"
        );


    const groupElements =
        document.querySelectorAll(
            ".group"
        );


    entries.forEach(entry=>{

        entry.addEventListener(
            "dragstart",
            function(event){

                const groupId =
                    Number(
                        this.dataset.groupId
                    );


                const index =
                    Number(
                        this.dataset.entryIndex
                    );


                draggedEntry = {

                    groupId:groupId,

                    index:index

                };


                event.dataTransfer.effectAllowed =
                    "move";


                event.dataTransfer.setData(
                    "text/plain",
                    JSON.stringify(
                        draggedEntry
                    )
                );


                this.classList.add(
                    "dragging"
                );

            }
        );


        entry.addEventListener(
            "dragend",
            function(){

                this.classList.remove(
                    "dragging"
                );


                clearDragIndicators();


                draggedEntry =
                    null;

            }
        );


        entry.addEventListener(
            "dragover",
            function(event){

                event.preventDefault();

                event.stopPropagation();


                event.dataTransfer.dropEffect =
                    "move";


                clearEntryDropIndicators();


                const rect =
                    this.getBoundingClientRect();


                const middle =
                    rect.top +
                    rect.height / 2;


                if(
                    event.clientY <
                    middle
                ){

                    this.classList.add(
                        "drop-before"
                    );

                }else{

                    this.classList.add(
                        "drop-after"
                    );

                }

            }
        );


        entry.addEventListener(
            "drop",
            function(event){

                event.preventDefault();

                event.stopPropagation();


                const targetGroupId =
                    Number(
                        this.dataset.groupId
                    );


                const targetIndex =
                    Number(
                        this.dataset.entryIndex
                    );


                const rect =
                    this.getBoundingClientRect();


                const insertAfter =
                    event.clientY >
                    rect.top +
                    rect.height / 2;


                movePlayer(
                    targetGroupId,
                    targetIndex,
                    insertAfter
                );

            }
        );

    });


    /* =================================================
       GROUP DROP
       ================================================= */

    groupElements.forEach(
        groupElement=>{

            const targetGroupId =
                Number(
                    groupElement.dataset.groupId
                );


            groupElement.addEventListener(
                "dragover",
                function(event){

                    event.preventDefault();

                    event.dataTransfer.dropEffect =
                        "move";


                    this.classList.add(
                        "drag-over"
                    );

                }
            );


            groupElement.addEventListener(
                "dragleave",
                function(event){

                    if(
                        !this.contains(
                            event.relatedTarget
                        )
                    ){

                        this.classList.remove(
                            "drag-over"
                        );

                    }

                }
            );


            groupElement.addEventListener(
                "drop",
                function(event){

                    event.preventDefault();


                    this.classList.remove(
                        "drag-over"
                    );


                    if(
                        event.target.closest(
                            ".entry"
                        )
                    ){

                        return;

                    }


                    movePlayerToGroup(
                        targetGroupId
                    );

                }
            );

        }
    );

}


/* =====================================================
   MOVE PLAYER TO GROUP
   ===================================================== */

function movePlayerToGroup(
    targetGroupId
){

    if(!draggedEntry){

        return;

    }


    const sourceGroup =
        getGroup(
            draggedEntry.groupId
        );


    const targetGroup =
        getGroup(
            targetGroupId
        );


    if(
        !sourceGroup ||
        !targetGroup
    ){

        return;

    }


    if(
        sourceGroup.id ===
        targetGroup.id
    ){

        const player =
            sourceGroup.entries.splice(
                draggedEntry.index,
                1
            )[0];


        if(player){

            sourceGroup.entries.push(
                player
            );

        }


        render();

        return;

    }


    const player =
        sourceGroup.entries.splice(
            draggedEntry.index,
            1
        )[0];


    if(!player){

        return;

    }


    targetGroup.entries.push(
        player
    );


    if(
        sourceGroup.entries.length === 0
    ){

        removeEmptyGroup(
            sourceGroup
        );

    }


    render();

}


/* =====================================================
   MOVE PLAYER WITH POSITION
   ===================================================== */

function movePlayer(
    targetGroupId,
    targetIndex,
    insertAfter
){

    if(!draggedEntry){

        return;

    }


    const sourceGroup =
        getGroup(
            draggedEntry.groupId
        );


    const targetGroup =
        getGroup(
            targetGroupId
        );


    if(
        !sourceGroup ||
        !targetGroup
    ){

        return;

    }


    /*
       REORDER WITHIN SAME GROUP
    */

    if(
        sourceGroup.id ===
        targetGroup.id
    ){

        const player =
            sourceGroup.entries.splice(
                draggedEntry.index,
                1
            )[0];


        if(!player){

            return;

        }


        let newIndex =
            targetIndex;


        if(
            draggedEntry.index <
            targetIndex
        ){

            newIndex--;

        }


        if(insertAfter){

            newIndex++;

        }


        newIndex =
            Math.max(
                0,
                Math.min(
                    newIndex,
                    sourceGroup.entries.length
                )
            );


        sourceGroup.entries.splice(
            newIndex,
            0,
            player
        );


        render();

        return;

    }


    /*
       MOVE TO DIFFERENT GROUP
    */

    const player =
        sourceGroup.entries.splice(
            draggedEntry.index,
            1
        )[0];


    if(!player){

        return;

    }


    let newIndex =
        targetIndex;


    if(insertAfter){

        newIndex++;

    }


    newIndex =
        Math.max(
            0,
            Math.min(
                newIndex,
                targetGroup.entries.length
            )
        );


    targetGroup.entries.splice(
        newIndex,
        0,
        player
    );


    /*
       Remove empty source group.
    */

    if(
        sourceGroup.entries.length === 0
    ){

        removeEmptyGroup(
            sourceGroup
        );

    }


    render();

}


/* =====================================================
   DRAG VISUAL CLEANUP
   ===================================================== */

function clearEntryDropIndicators(){

    document
        .querySelectorAll(
            ".drop-before,.drop-after"
        )
        .forEach(element=>{

            element.classList.remove(
                "drop-before",
                "drop-after"
            );

        });

}


function clearDragIndicators(){

    document
        .querySelectorAll(
            ".drag-over"
        )
        .forEach(element=>{

            element.classList.remove(
                "drag-over"
            );

        });


    clearEntryDropIndicators();

}


/* =====================================================
   CLEAR TIMERS
   ===================================================== */

function clearTimers(group){

    if(
        !group ||
        !group.timers
    ){

        return;

    }


    group.timers.forEach(
        timer=>{

            clearTimeout(timer);

            clearInterval(timer);

        }
    );


    group.timers = [];

}


/* =====================================================
   CANCEL
   ===================================================== */

function cancelGroup(id){

    const group =
        getGroup(id);


    if(!group){

        return;

    }


    clearTimers(group);


    group.state =
        "idle";


    hideOverlay();


    render();

}


/* =====================================================
   RESET
   ===================================================== */

function resetGroup(id){

    cancelGroup(id);

}


/* =====================================================
   HIDE GROUP
   ===================================================== */

function hideGroup(id){

    const group =
        getGroup(id);


    if(!group){

        return;

    }


    group.hidden =
        true;


    render();

}


/* =====================================================
   BEEP
   ===================================================== */

function beep(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            return;

        }


        const ctx =
            new AudioContext();


        const osc =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        osc.type =
            "square";


        osc.frequency.value =
            1000;


        osc.connect(gain);

        gain.connect(
            ctx.destination
        );


        gain.gain.setValueAtTime(
            0.2,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + 0.4
        );


        osc.start();


        osc.stop(
            ctx.currentTime + 0.4
        );

    }catch(error){

        console.log(
            "Audio unavailable"
        );

    }

}


/* =====================================================
   SHOW OVERLAY
   ===================================================== */

function showOverlay(
    groupName,
    playerName
){

    overlayGroup.textContent =
        groupName;


    overlayName.textContent =
        playerName;


    overlay.classList.add(
        "show"
    );


    setTimeout(()=>{

        overlay.classList.remove(
            "show"
        );

    },1800);

}


/* =====================================================
   HIDE OVERLAY
   ===================================================== */

function hideOverlay(){

    overlay.classList.remove(
        "show"
    );

}


/* =====================================================
   START GROUP
   ===================================================== */

function startGroup(id){

    const group =
        getGroup(id);


    if(!group){

        return;

    }


    if(
        group.entries.length === 0
    ){

        return;

    }


    clearTimers(group);


    group.state =
        "readying";


    render();


    const timeline =
        document.getElementById(
            `timeline-${group.id}`
        );


    if(!timeline){

        return;

    }


    const ready =
        parseInt(
            document.getElementById(
                "readyTime"
            ).value
        ) || 5;


    let remaining =
        ready;


    timeline.innerHTML = `

        <div class="big">
            ${remaining}
        </div>

        <div class="label">
            READY CHECK
        </div>

        <div class="next">
            Launching sequence...
        </div>

    `;


    if(ready <= 0){

        beginLaunch(group);

        return;

    }


    const countdown =
        setInterval(()=>{

            beep();

            remaining--;


            if(
                remaining <= 0
            ){

                clearInterval(
                    countdown
                );


                beginLaunch(
                    group
                );

            }else{

                const big =
                    timeline.querySelector(
                        ".big"
                    );


                if(big){

                    big.textContent =
                        remaining;

                }

            }

        },1000);


    group.timers.push(
        countdown
    );

}


/* =====================================================
   BEGIN LAUNCH
   ===================================================== */

function beginLaunch(group){

    group.state =
        "active";


    render();


    const timeline =
        document.getElementById(
            `timeline-${group.id}`
        );


    if(!timeline){

        return;

    }


    const sorted =
        [...group.entries].sort(
            (a,b)=>
                b.duration -
                a.duration
        );


    const max =
        sorted[0].duration;


    const launchPlan =
        sorted.map(entry=>({

            ...entry,

            offset:
                max -
                entry.duration

        }));


    const startTime =
        Date.now();


    timeline.innerHTML = `

        <div class="big">
            ${max}
        </div>

        <div class="label">
            SYNC ACTIVE
        </div>

        <div class="next">
            Waiting for next launch...
        </div>

    `;


    const ticker =
        setInterval(()=>{

            const elapsed =
                Math.floor(
                    (
                        Date.now() -
                        startTime
                    ) / 1000
                );


            const remain =
                Math.max(
                    0,
                    max - elapsed
                );


            const big =
                timeline.querySelector(
                    ".big"
                );


            if(big){

                big.textContent =
                    remain;

            }

        },100);


    group.timers.push(
        ticker
    );


    launchPlan.forEach(
        item=>{

            const timer =
                setTimeout(()=>{

                    beep();


                    showOverlay(
                        group.name,
                        item.name
                    );


                    const next =
                        timeline.querySelector(
                            ".next"
                        );


                    if(next){

                        next.textContent =
                            `${item.name} STARTED`;

                    }

                },item.offset * 1000);


            group.timers.push(
                timer
            );

        }
    );


    const finish =
        setTimeout(()=>{

            clearInterval(
                ticker
            );


            group.state =
                "complete";


            render();


            const tl =
                document.getElementById(
                    `timeline-${group.id}`
                );


            if(tl){

                tl.innerHTML = `

                    <div class="big">
                        DONE
                    </div>

                    <div class="label">
                        All marches completed together
                    </div>

                `;

            }

        },max * 1000);


    group.timers.push(
        finish
    );

}


/* =====================================================
   INITIAL RENDER
   ===================================================== */

render();

passwordInput.focus();

</script>
